# frontend-studio_v4 — Scenify CRA editor in Docker Desktop.
#
#   docker compose -f docker/studio-v4/docker-compose.yml up -d --build
#   http://localhost:3004/
#
# Stop:
#   docker compose -f docker/studio-v4/docker-compose.yml down

services:
  studio-v4:
    build:
      context: ../..
      dockerfile: docker/studio-v4/Dockerfile
    container_name: herald-studio-v4
    ports:
      - "3004:3004"
    volumes:
      - ../../frontend-studio_v4:/app
      - /app/node_modules
    environment:
      HOST: "0.0.0.0"
      PORT: "3004"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"
      BROWSER: "none"
      WDS_SOCKET_PORT: "3004"
    restart: unless-stopped
