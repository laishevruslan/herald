# frontend-studio_v3 — Next.js Fabric editor in Docker Desktop.
#
#   docker compose -f docker/studio-v3/docker-compose.yml up -d --build
#   http://localhost:3003/
#
# Stop:
#   docker compose -f docker/studio-v3/docker-compose.yml down

services:
  studio-v3:
    build:
      context: ../..
      dockerfile: docker/studio-v3/Dockerfile
    container_name: herald-studio-v3
    ports:
      - "3003:3003"
    volumes:
      - ../../frontend-studio_v3:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
    restart: unless-stopped
