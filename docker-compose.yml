# Example docker-compose for self-hosting ScreenTinker.
#   cp docker-compose.example.yml docker-compose.yml   # then edit to taste
# The container serves plain HTTP on 3001 - front it with a TLS-terminating
# reverse proxy or Cloudflare in production.
services:
  screentinker:
    # image: ghcr.io/laishevruslan/herald:latest
    # ...or build from source instead of pulling:
    # build: .
    build: .
    image: herald:local
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      SELF_HOSTED: "true"            # first registered user becomes admin, no billing
      # JWT_SECRET: "set-a-long-random-string"   # else one is generated under /data/certs
      # DISABLE_HOMEPAGE: "true"     # redirect / to the app instead of the landing page
      # ---- Live video + Talk (go2rtc sidecar below; see docs/live-video.md) ----
      # LIVE_VIDEO_ENABLED: "true"           # server master gate; also enable per workspace + per device
      GO2RTC_URL: "http://go2rtc:1984"     # sidecar API on the compose network; browser never sees this
      # GO2RTC_API_TOKEN: "a-long-random-string"   # if you protect go2rtc's API; must match go2rtc.yaml
      GO2RTC_STUN_URLS: "stun:stun.l.google.com:19302"   # public STUN for ICE; helps most NATs
      GO2RTC_TIMEOUT_MS: "20000"           # WHIP/WHEP SDP; default 4s is too short when STUN is slow
      # GO2RTC_TURN_URL: "turn:turn.example.com:3478"      # only when UDP 8555 + host candidates are both unreachable
      # GO2RTC_TURN_USER: "user"
      # GO2RTC_TURN_PASS: "pass"
      TALK_ENABLED: "true"                 # master switch for voice Talk / PA; then enable per org under Admin -> Organizations
                                           # (an org can also set its own STUN/TURN there, overriding GO2RTC_* for its video + talk)
    depends_on:
      - go2rtc
    volumes:
      - st-data:/data               # db, uploads, and the jwt secret persist here
      # To enable OTA APK downloads, mount a built APK read-only:
      # - ./ScreenTinker.apk:/data/ScreenTinker.apk:ro
    healthcheck:
      # image is node:20-slim (no curl) - use node's built-in fetch
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s             # first boot runs db migrations

# go2rtc sidecar: WebRTC live view + Talk (Opus). ScreenTinker stays fail-soft if this is down.
#
#   1984  go2rtc HTTP API. Bound to loopback only so a host-run `npm start` can reach it;
#         never published on the LAN or internet. The screentinker container uses http://go2rtc:1984
#         on the compose network and does not need this mapping.
#   8555  WebRTC. tcp works behind a reverse proxy and on plain-HTTP LANs; udp is lower latency but
#         needs the port open end to end (a Cloudflare orange-cloud proxy drops UDP - see the docs).
#
# Docker Desktop / Windows cannot use network_mode: host, so this service stays on the compose
# bridge and publishes 8555. Linux LAN operators who want host ICE candidates can switch to
# network_mode: host, drop the ports, and set GO2RTC_URL=http://host.docker.internal:1984.
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    # Publishing from a device with NO H264 encoder (e.g. the Android emulator)? Stock go2rtc
    # accepts only H264/H265 on WebRTC ingest and rejects VP8. Build docker/go2rtc-vp8 and use
    # `image: screentinker/go2rtc-vp8:1.9.14` instead. See docs/live-video.md ("Codecs"). Talk
    # (Opus) does not need the patch.
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "127.0.0.1:1984:1984"
      - "8555:8555/tcp"
      - "8555:8555/udp"

# Locked out of the admin account? Reset it with:
#   docker exec -it screentinker node scripts/reset-admin.js

volumes:
  st-data:
