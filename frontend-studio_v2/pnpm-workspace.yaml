packages:
  - "."

# Native/postinstall builds — keep in sync with package.json pnpm.onlyBuiltDependencies
onlyBuiltDependencies:
  - esbuild
  - workerd

minimumReleaseAgeExclude:
  # First-party Clawnify package — exempt from the new-release age gate so app
  # builds pick up fresh versions promptly.
  - "@clawnify/routes"
  - "@clawnify/app"
